<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">WebConsole preview</title>
  <desc id="desc">Dark web terminal dashboard preview with low-bandwidth local input mode.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#89ddff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <circle cx="795" cy="95" r="160" fill="#58a6ff" opacity=".12"/>
  <circle cx="140" cy="470" r="210" fill="#c792ea" opacity=".10"/>
  <g filter="url(#shadow)">
    <rect x="86" y="74" width="788" height="392" rx="24" fill="#161b22" stroke="#30363d"/>
    <rect x="86" y="74" width="788" height="56" rx="24" fill="#0d1117"/>
    <path d="M86 106h788v24H86z" fill="#0d1117"/>
    <circle cx="126" cy="102" r="8" fill="#ff5370"/>
    <circle cx="154" cy="102" r="8" fill="#ffcb6b"/>
    <circle cx="182" cy="102" r="8" fill="#c3e88d"/>
    <rect x="682" y="91" width="74" height="24" rx="12" fill="#12324a" stroke="#58a6ff"/>
    <text x="719" y="108" text-anchor="middle" fill="#89ddff" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">LOCAL</text>
    <rect x="770" y="91" width="62" height="24" rx="12" fill="#193321" stroke="#3fb950"/>
    <text x="801" y="108" text-anchor="middle" fill="#c3e88d" font-family="Inter, sans-serif" font-size="12" font-weight="700">LIVE</text>
    <rect x="118" y="158" width="724" height="270" rx="16" fill="#1a1a2e" stroke="#30363d"/>
    <text x="146" y="198" fill="#89ddff" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700">WebConsole</text>
    <text x="146" y="236" fill="#c3e88d" font-family="JetBrains Mono, monospace" font-size="16">nanoclaw@devfast:~$</text>
    <text x="360" y="236" fill="#eee" font-family="JetBrains Mono, monospace" font-size="16">opencode run</text>
    <rect x="468" y="220" width="10" height="22" fill="url(#accent)">
      <animate attributeName="opacity" values="1;.15;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="146" y="286" fill="#8b949e" font-family="JetBrains Mono, monospace" font-size="15">binary frames • zlib • 22 FPS batching</text>
    <text x="146" y="326" fill="#8b949e" font-family="JetBrains Mono, monospace" font-size="15">local typing: instant • send on Enter</text>
    <rect x="146" y="358" width="248" height="34" rx="17" fill="#0d1117" stroke="#30363d"/>
    <text x="270" y="381" text-anchor="middle" fill="#58a6ff" font-family="Inter, sans-serif" font-size="14" font-weight="700">Tailscale-only terminal</text>
  </g>
</svg>
