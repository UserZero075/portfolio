<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasas de Cambio M.V. - Marlon Sarduy Machado</title>
    <meta name="description" content="Exchange-rate website in Cuban pesos for the Cuban market, developed for a client.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Tasas de Cambio M.V. - Marlon Sarduy Machado">
    <meta property="og:description" content="Exchange-rate website in Cuban pesos for the Cuban market, developed for a client.">
    <meta property="og:url" content="https://userzero075.github.io/portfolio/p/tasas-mv.html">
    <meta property="og:image" content="https://userzero075.github.io/portfolio/mvtasas-preview.gif">
    <meta property="og:site_name" content="Marlon Sarduy Machado - Portfolio">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tasas de Cambio M.V. - Marlon Sarduy Machado">
    <meta name="twitter:description" content="Exchange-rate website in Cuban pesos for the Cuban market, developed for a client.">
    <meta name="twitter:image" content="https://userzero075.github.io/portfolio/mvtasas-preview.gif">
    <style>
        :root {
            --bg: #f5f5f5;
            --card: #ffffff;
            --accent: #aeb1b4;
            --accent2: #666;
            --text: #1a1a1a;
            --muted: #666;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }
        .container { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem; }
        .back-link { display: inline-flex; align-items: center; gap: 0.4rem; margin-bottom: 2rem; color: var(--accent2); text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: color 0.2s; }
        .back-link:hover { color: var(--accent); }
        .hero { display: flex; gap: 1.5rem; align-items: flex-start; margin-bottom: 2rem; flex-wrap: wrap; }
        .hero img { width: 220px; height: 130px; object-fit: cover; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .hero-info h1 { margin: 0 0 0.6rem; font-size: 1.6rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
        .hero-info p { margin: 0; color: var(--muted); line-height: 1.65; font-size: 0.95rem; }
        .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin: 1.5rem 0 2rem; }
        .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.55rem 1.1rem; border-radius: 8px; text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: all 0.2s ease; border: 1px solid transparent; }
        .btn-github { background: rgba(255,255,255,0.08); color: var(--text); border-color: rgba(255,255,255,0.12); }
        .btn-github:hover { background: rgba(255,255,255,0.14); transform: translateY(-1px); }
        .btn-page { background: var(--accent); color: #fff; }
        .btn-page:hover { filter: brightness(1.15); transform: translateY(-1px); }
        .btn-details { background: transparent; color: var(--muted); border-color: rgba(255,255,255,0.15); }
        .btn-details:hover { color: var(--text); border-color: var(--accent); transform: translateY(-1px); }
        .section { margin: 2rem 0; padding: 1.5rem; background: var(--card); border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); }
        .section h2 { color: var(--accent2); font-size: 1.1rem; margin-bottom: 0.75rem; font-weight: 600; }
        .section p { color: var(--muted); line-height: 1.75; font-size: 0.95rem; }
        .lang-switch { position: fixed; top: 1rem; right: 1rem; z-index: 10; display: flex; gap: 0.4rem; }
        .lang-btn { background: rgba(255,255,255,0.08); color: var(--muted); border: 1px solid rgba(255,255,255,0.12); padding: 0.35rem 0.7rem; cursor: pointer; border-radius: 6px; font-size: 0.8rem; font-weight: 500; transition: all 0.2s; }
        .lang-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .lang-btn:hover:not(.active) { color: var(--text); border-color: var(--accent2); }
        .footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.06); text-align: center; color: var(--muted); font-size: 0.8rem; }
        @media (max-width: 600px) {
            .hero { flex-direction: column; }
            .hero img { width: 100%; height: auto; }
            .hero-info h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="lang-switch"><button class="lang-btn" data-lang="en">EN</button><button class="lang-btn" data-lang="es">ES</button></div>
    <div class="container">
        <a href="../index.html" class="back-link" data-i18n="backToPortfolio">← Back to Portfolio</a>
        <div class="hero">
            <img src="../mvtasas-preview.gif" alt="Tasas de Cambio M.V. preview">
            <div class="hero-info">
                <h1>Tasas de Cambio M.V.</h1>
                <p data-i18n="desc">Exchange-rate website in Cuban pesos for the Cuban market, developed for a client.</p>
            </div>
        </div>
        <div class="actions">
            
            <a href="https://mvtasas.duckdns.org" target="_blank" class="btn btn-page">Página</a>
            <a href="../index.html#tasas-mv" class="btn btn-details">← Portfolio</a>
        </div>
    </div>
    <div class="footer">Marlon Sarduy Machado · UserZero075</div>
    <script>
        const translations = {
            en: {
                backToPortfolio: "← Back to Portfolio",
                aboutProject: "About this project",
                desc: "Exchange-rate website in Cuban pesos for the Cuban market, developed for a client."
            },
            es: {
                backToPortfolio: "← Volver al Portfolio",
                aboutProject: "Sobre este proyecto",
                desc: "Web de tasas de cambio en CUP para el mercado cubano, desarrollada para un cliente."
            }
        };
        function initI18n() {
            let l = localStorage.getItem('portfolio_lang') || 'en';
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
            document.querySelectorAll('[data-i18n]').forEach(e => { let k = e.getAttribute('data-i18n'); if (translations[l][k]) e.textContent = translations[l][k]; });
        }
        document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => {
            let l = b.dataset.lang; localStorage.setItem('portfolio_lang', l); initI18n();
        }));
        initI18n();
    </script>
</body>
</html>
